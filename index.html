<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Free Flow — Physical Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #020205;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: white;
  }

  #cv {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    touch-action: none;
  }

  /* ── UI Layers ── */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2, 2, 5, 0.95);
    z-index: 20;
    transition: opacity 0.5s ease;
  }

  #start-ui .icon-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 1px solid rgba(167,139,250,0.3);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(167,139,250,0.1);
  }

  h1 { font-weight: 300; letter-spacing: 4px; margin-bottom: 8px; text-transform: uppercase; font-size: 1.2rem; }
  p { color: rgba(255,255,255,0.5); font-size: 14px; text-align: center; margin-bottom: 32px; line-height: 1.6; }

  .btn {
    padding: 14px 40px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 100px;
    background: transparent;
    border: 1px solid rgba(167,139,250,0.6);
    color: #a78bfa;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn:hover { background: rgba(167,139,250,0.1); box-shadow: 0 0 20px rgba(167,139,250,0.2); }

  #loading-ui { display: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 2px solid rgba(167,139,250,0.1);
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── HUD ── */
  #hud {
    position: fixed;
    top: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
    opacity: 0.6;
  }
  .pill {
    font-size: 10px; font-family: monospace;
    background: rgba(255,255,255,0.05);
    padding: 6px 12px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  #controls {
    position: fixed;
    bottom: 30px; right: 30px;
    display: flex; gap: 12px;
    z-index: 15;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div class="pill" id="hand-status">Waiting for input...</div>
  <div class="pill" id="audio-status">Audio: Ready</div>
</div>

<div id="start-ui" class="overlay">
  <div class="icon-ring">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.5">
      <path d="M12 2v20M2 12h20" stroke-opacity="0.3"/>
      <circle cx="12" cy="12" r="10" />
      <path d="M8 12h8" />
    </svg>
  </div>
  <h1>Free Flow Sandbox</h1>
  <p>Pinch and grab floating shapes.<br>Toss cubes and spheres to generate sonic textures.</p>
  <button class="btn" id="startBtn">Enter Experience</button>
</div>

<div id="loading-ui" class="overlay">
  <div class="spinner"></div>
  <p id="loadtxt" style="margin:0">Loading AI Tracking...</p>
</div>

<div id="controls">
  <button class="icon-btn" id="muteBtn" title="Toggle Sound">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>
  <button class="icon-btn" id="resetBtn" title="Reset Sandbox">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
'use strict';

/* ─────────────────────────────────────────
   AUDIO ENGINE
───────────────────────────────────────── */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterBus = null;
    this.initialized = false;
    this.muted = false;
  }

  init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterBus = this.ctx.createGain();
    this.masterBus.gain.value = 0.4;
    this.masterBus.connect(this.ctx.destination);
    this.initialized = true;
  }

  trigger(type, velocity) {
    if (!this.initialized || this.muted) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    // Low frequency for cubes, high for spheres
    const freq = type === 'cube' ? 120 + (Math.random() * 40) : 440 + (Math.random() * 200);
    
    osc.type = type === 'cube' ? 'square' : 'sine';
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    
    const vol = Math.min(0.5, velocity * 0.1);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = type === 'cube' ? 800 : 3000;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterBus);

    osc.start();
    osc.stop(this.ctx.currentTime + 1);
  }

  toggleMute() {
    if (!this.initialized) return false;
    this.muted = !this.muted;
    this.masterBus.gain.setTargetAtTime(this.muted ? 0 : 0.4, this.ctx.currentTime, 0.1);
    return this.muted;
  }
}

const audio = new AudioEngine();

/* ─────────────────────────────────────────
   PHYSICS & CORE
───────────────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR = window.devicePixelRatio || 1;

const CFG = {
  gravity: 0.12,
  damping: 0.99,
  friction: 0.95,
  numObjects: 14,
  grabDist: 50,
};

const PALETTE = ['#a78bfa', '#f472b6', '#fbbf24', '#34d399', '#60a5fa'];

class PhysObject {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.px = x;
    this.py = y;
    this.type = type; // 'cube' or 'sphere'
    this.size = 25 + Math.random() * 20;
    this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.grabbedBy = null; // Stores { handIdx, pointIdx }
    this.rotation = Math.random() * Math.PI;
    this.vRot = (Math.random() - 0.5) * 0.1;
  }

  update() {
    if (this.grabbedBy) return;

    const vx = (this.x - this.px) * CFG.damping;
    const vy = (this.y - this.py) * CFG.damping;

    this.px = this.x;
    this.py = this.y;

    this.x += vx;
    this.y += vy + CFG.gravity;
    this.rotation += this.vRot;
    this.vRot *= 0.98;

    // Boundaries
    const r = this.size / 2;
    if (this.y + r > H) {
      this.y = H - r;
      this.py = this.y + vy * 0.5;
      if (Math.abs(vy) > 2) audio.trigger(this.type, Math.abs(vy));
    }
    if (this.y - r < 0) {
      this.y = r;
      this.py = this.y + vy * 0.5;
    }
    if (this.x + r > W) {
      this.x = W - r;
      this.px = this.x + vx * 0.5;
      if (Math.abs(vx) > 2) audio.trigger(this.type, Math.abs(vx));
    }
    if (this.x - r < 0) {
      this.x = r;
      this.px = this.x + vx * 0.5;
      if (Math.abs(vx) > 2) audio.trigger(this.type, Math.abs(vx));
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;

    if (this.type === 'sphere') {
      ctx.beginPath();
      ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
      ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
    }
    ctx.restore();
  }
}

let objects = [];
let rawHands = [];
let smoothHands = [];
let videoEl = null;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = W * DPR;
  cv.height = H * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
  initSandbox();
}

function initSandbox() {
  objects = [];
  for (let i = 0; i < CFG.numObjects; i++) {
    const type = Math.random() > 0.5 ? 'cube' : 'sphere';
    objects.push(new PhysObject(Math.random() * W, Math.random() * H, type));
  }
}

function update() {
  const TIP_IDS = [4, 8, 12, 16, 20];
  
  // Smoothing hand landmarks
  if (rawHands.length > 0) {
    if (smoothHands.length !== rawHands.length) smoothHands = JSON.parse(JSON.stringify(rawHands));
    for (let i = 0; i < rawHands.length; i++) {
      if (!smoothHands[i]) smoothHands[i] = JSON.parse(JSON.stringify(rawHands[i]));
      for (let j = 0; j < 21; j++) {
        smoothHands[i][j].x += (rawHands[i][j].x - smoothHands[i][j].x) * 0.4;
        smoothHands[i][j].y += (rawHands[i][j].y - smoothHands[i][j].y) * 0.4;
      }
    }
  } else {
    smoothHands = [];
  }

  // Update physics
  objects.forEach(obj => obj.update());

  // Hand interaction
  smoothHands.forEach((hand, hIdx) => {
    TIP_IDS.forEach(tIdx => {
      const tip = hand[tIdx];
      const palm = hand[0];
      const pinchDist = Math.sqrt(Math.pow(tip.x - hand[4].x, 2) + Math.pow(tip.y - hand[4].y, 2));
      const isPinching = tIdx !== 4 && pinchDist < 40;

      // Find if this specific finger tip is already grabbing an object
      const grabbedObj = objects.find(o => o.grabbedBy && o.grabbedBy.hIdx === hIdx && o.grabbedBy.tIdx === tIdx);

      if (grabbedObj) {
        if (!isPinching) {
          // Release
          const vx = (tip.x - grabbedObj.px);
          const vy = (tip.y - grabbedObj.py);
          grabbedObj.px = tip.x - vx;
          grabbedObj.py = tip.y - vy;
          grabbedObj.vRot = (Math.random() - 0.5) * 0.5;
          grabbedObj.grabbedBy = null;
          audio.trigger(grabbedObj.type, 5);
        } else {
          // Carry
          grabbedObj.px = grabbedObj.x;
          grabbedObj.py = grabbedObj.y;
          grabbedObj.x = tip.x;
          grabbedObj.y = tip.y;
        }
      } else if (isPinching) {
        // Try to grab nearest
        const available = objects.find(o => !o.grabbedBy && Math.sqrt(Math.pow(o.x - tip.x, 2) + Math.pow(o.y - tip.y, 2)) < CFG.grabDist);
        if (available) {
          available.grabbedBy = { hIdx, tIdx };
          audio.trigger(available.type, 1);
        }
      }
    });
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  // Ghost background video
  if (videoEl && videoEl.readyState >= 2) {
    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(videoEl, 0, 0, W, H);
    ctx.restore();
  }

  // Draw objects
  objects.forEach(obj => obj.draw(ctx));

  // Visual Hands
  smoothHands.forEach((hand, idx) => {
    const col = idx === 0 ? '167,139,250' : '52,211,153';
    ctx.strokeStyle = `rgba(${col}, 0.2)`;
    ctx.lineWidth = 1;
    
    const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
    connections.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(hand[a].x, hand[a].y);
      ctx.lineTo(hand[b].x, hand[b].y);
      ctx.stroke();
    });

    hand.forEach((p, pIdx) => {
      const isTip = [4, 8, 12, 16, 20].includes(pIdx);
      ctx.fillStyle = isTip ? `rgb(${col})` : `rgba(${col}, 0.5)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isTip ? 5 : 2, 0, Math.PI*2);
      ctx.fill();
    });
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

async function start() {
  const startUI = document.getElementById('start-ui');
  const loadUI = document.getElementById('loading-ui');
  const loadTxt = document.getElementById('loadtxt');

  startUI.style.opacity = '0';
  setTimeout(() => startUI.style.display = 'none', 500);
  loadUI.style.display = 'flex';
  
  audio.init();

  try {
    loadTxt.innerText = "Accessing Camera...";
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: 1280, height: 720, facingMode: 'user' } 
    });
    
    videoEl = document.createElement('video');
    videoEl.srcObject = stream;
    videoEl.muted = true;
    videoEl.playsInline = true;

    await new Promise((resolve) => {
      videoEl.onloadedmetadata = () => resolve();
    });

    try {
      await videoEl.play();
    } catch (e) {
      console.warn("Video blocked", e);
    }

    loadTxt.innerText = "Loading AI Vision...";
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      rawHands = [];
      if (results.multiHandLandmarks) {
        results.multiHandLandmarks.forEach(landmarks => {
          rawHands.push(landmarks.map(l => ({ x: (1 - l.x) * W, y: l.y * H })));
        });
      }
      document.getElementById('hand-status').innerText = rawHands.length > 0 ? `${rawHands.length} Active` : 'Scan Hands';
    });

    const camera = new Camera(videoEl, {
      onFrame: async () => {
        if (!videoEl.paused) {
          await hands.send({ image: videoEl });
        }
      },
      width: 1280, height: 720
    });
    
    await camera.start();
    loadUI.style.display = 'none';
    resize();
    loop();

  } catch (err) {
    console.error(err);
    loadTxt.innerText = "Error initializing. Check camera permissions.";
  }
}

document.getElementById('startBtn').onclick = start;
document.getElementById('resetBtn').onclick = initSandbox;
document.getElementById('muteBtn').onclick = () => {
  const isMuted = audio.toggleMute();
  document.getElementById('audio-status').innerText = isMuted ? 'Audio: Muted' : 'Audio: Active';
  document.getElementById('muteBtn').style.color = isMuted ? '#f87171' : 'white';
};

window.addEventListener('resize', resize);
</script>
</body>
</html>
